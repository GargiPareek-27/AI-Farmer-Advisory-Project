name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soya_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soya_pipeline/requirements-dev.txt
      - name: Install (CPU, no PyTorch)
        run: pip install -r requirements-dev.txt
      - name: Lint (errors only)
        run: ruff check .
      - name: Syntax-check every script (including the PyTorch ones)
        run: python -m compileall -q .
      - name: Unit and end-to-end tests on synthetic data
        run: python -m pytest
